spring:
  config:
    import: optional:configserver:http://localhost:8888
  application:
    name: order-service
  datasource:
    url: ${DB_URL}/orders
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}.
    hostname: localhost
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG

# External service URLs (override via environment variables)
product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
customer:
  service:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8083}
payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

